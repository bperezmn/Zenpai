server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA: cualquier ruta cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # el service worker y el index NO se cachean (para que las actualizaciones lleguen)
  location = /sw.js          { add_header Cache-Control "no-cache"; }
  location = /registerSW.js  { add_header Cache-Control "no-cache"; }
  location = /index.html     { add_header Cache-Control "no-cache"; }
  location = /manifest.webmanifest { add_header Cache-Control "no-cache"; types { } default_type application/manifest+json; }

  # assets con hash → cache largo inmutable
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
